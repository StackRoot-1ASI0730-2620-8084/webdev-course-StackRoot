<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página de perfil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Encabezado: foto, apodo y frase -->
<header>
  <img src="https://picsum.photos/id/237/300/300" alt="Foto de un perrito como imagen de perfil">
  <h1>Juanito</h1>
  <p>Estudiante de páginas web</p>
</header>

<main>
  <!-- Cada section es una tarjeta -->
  <section>
    <h2>Sobre mí</h2>
    <p>Soy un estudiante entusiasta por aprender más de programación.</p>
  </section>

  <section>
    <h2>Mis gustos</h2>
    <ul>
      <li>HTML</li>
      <li>Arte</li>
      <li>Ciencias</li>
      <li>Letras</li>
    </ul>
  </section>

  <section>
    <h2>Mis enlaces</h2>
    <!-- href es la dirección del enlace -->
    <ul>
      <li><a href="https://developer.mozilla.org/es/" target="_blank">MDN Web Docs</a></li>
      <li><a href="https://validator.w3.org/" target="_blank">Validador W3C</a></li>
    </ul>
  </section>
</main>

<footer>
  <p>© 2026 Juanito, estudiante de páginas web</p>
</footer>
</body>
</html>
